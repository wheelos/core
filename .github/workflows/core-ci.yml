name: WheelOS Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-22.04
    env:
      PYTHONUSERBASE: ${{ runner.temp }}/wheelos-python-userbase
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install protobuf runtime for generated Python code
        run: python -m pip install --user "protobuf==5.29.5"
      - name: Read Bazel version
        id: bazel-version
        run: echo "version=$(cat .bazelversion)" >> "$GITHUB_OUTPUT"
      - name: Set up Bazel with cache
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          bazel-version: ${{ steps.bazel-version.outputs.version }}
      - name: Run Ubuntu 22.04 baseline
        run: bash scripts/release/ubuntu2204_baseline.sh
