name: WheelOS Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/wheelos-core-testing/repository
            ~/.cache/wheelos-core-testing/disk
            ~/.cache/wheelos-core-testing/pip
          key: core-container-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: core-container-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-
      - name: Unit contracts in Ubuntu 22.04 container
        run: python3 scripts/testing/container_test.py unit --build-images
      - name: Integration and short performance regression in private IPC container
        run: python3 scripts/testing/container_test.py integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: |
            artifacts/testing/unit/
            artifacts/testing/integration/
