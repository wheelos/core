name: PyCyber Verification and Release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "BUILD"
      - "scripts/runtime/**"
      - "scripts/env/**"
      - ".github/workflows/release-pycyber.yml"
      - "packaging/pycyber/**"
      - "scripts/release/build_and_package_pycyber.sh"
      - "scripts/release/build_release_artifacts.sh"
      - "scripts/release/check_bzlmod_lockfile.sh"
      - "scripts/release/check_release_version.py"
      - "scripts/release/release_scripts_test.py"
      - "scripts/release/generate_pycyber_api_docs.py"
      - "scripts/release/install_and_generate_docs.sh"
      - "scripts/release/build_pycyber.py"
      - "scripts/release/validate_pycyber.py"
      - ".bazelrc"
      - ".bazelversion"
      - "cyber/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "scripts/testing/**"
      - "tests/**"
      - "runtime/**"
      - "docker/test.dockerfile"
  push:
    tags:
      - "wheelos_core-v*"
    paths:
      - "BUILD"
      - "scripts/runtime/**"
      - "scripts/env/**"
      - ".github/workflows/release-pycyber.yml"
      - "packaging/pycyber/**"
      - "scripts/release/build_and_package_pycyber.sh"
      - "scripts/release/build_release_artifacts.sh"
      - "scripts/release/check_bzlmod_lockfile.sh"
      - "scripts/release/check_release_version.py"
      - "scripts/release/release_scripts_test.py"
      - "scripts/release/generate_pycyber_api_docs.py"
      - "scripts/release/install_and_generate_docs.sh"
      - "scripts/release/build_pycyber.py"
      - "scripts/release/validate_pycyber.py"
      - ".bazelrc"
      - ".bazelversion"
      - "cyber/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/wheelos_core-v') }}

permissions:
  contents: read

jobs:
  build-and-validate-wheel:
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_suffix: linux-x86_64
            runs_on: ubuntu-22.04
          - artifact_suffix: linux-aarch64
            runs_on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs_on }}
    env:
      PYTHONUSERBASE: ${{ runner.temp }}/wheelos-python-userbase
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/wheelos-core-testing/repository
            ~/.cache/wheelos-core-testing/disk
            ~/.cache/wheelos-core-testing/pip
          key: release-container-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: release-container-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-

      - name: Build ARM wheel in pinned Ubuntu container
        if: matrix.artifact_suffix == 'linux-aarch64'
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--publish)
          fi
          python3 scripts/testing/container_test.py wheel --build-images "${args[@]}"

      - name: Build and test native and Python candidate in containers
        if: matrix.artifact_suffix == 'linux-x86_64' && !startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/testing/container_test.py package --build-images
          python3 scripts/testing/container_test.py e2e

      - name: Qualify exact tagged candidate before publication
        if: matrix.artifact_suffix == 'linux-x86_64' && startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/testing/qualify_release.py --publish --build-images

      - name: Export self-contained Python candidate without rebuilding
        run: |
          python3 scripts/testing/artifacts.py \
            artifacts/testing/candidate artifacts/testing/python-candidate

      - uses: actions/upload-artifact@v4
        with:
          name: pycyber-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          path: artifacts/testing/python-candidate/

      - uses: actions/upload-artifact@v4
        if: matrix.artifact_suffix == 'linux-x86_64'
        with:
          name: native-release-candidate
          path: |
            artifacts/testing/candidate/
            artifacts/testing/qualification.json

      - uses: actions/upload-artifact@v4
        if: always() && matrix.artifact_suffix == 'linux-x86_64'
        with:
          name: candidate-test-reports
          path: |
            artifacts/testing/unit/
            artifacts/testing/integration/
            artifacts/testing/e2e/
            artifacts/testing/perf/

  verify-python-compat:
    needs: build-and-validate-wheel
    strategy:
      fail-fast: false
      matrix:
        artifact_suffix: [linux-x86_64, linux-aarch64]
        python-version: ["3.10"]
    runs-on: ${{ matrix.artifact_suffix == 'linux-aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: pycyber-${{ matrix.artifact_suffix }}
          path: dist

      - name: Validate installed wheel processes in runtime-only container
        shell: bash
        run: |
          python3 scripts/testing/container_test.py e2e --wheel-only --artifacts dist --build-images

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-e2e-${{ matrix.artifact_suffix }}
          path: artifacts/testing/e2e/

  publish-pypi:
    needs: [build-and-validate-wheel, verify-python-compat]
    if: startsWith(github.ref, 'refs/tags/wheelos_core-v')
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: pycyber-*
          path: ${{ runner.temp }}/python-candidates

      - name: Collect only tested distributions for PyPI
        run: |
          mkdir -p "$RUNNER_TEMP/pycyber-dist"
          find "$RUNNER_TEMP/python-candidates" -type f \
            \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp '{}' "$RUNNER_TEMP/pycyber-dist/" \;

      - uses: actions/download-artifact@v4
        with:
          name: native-release-candidate
          path: ${{ runner.temp }}/native-evidence

      - uses: actions/download-artifact@v4
        with:
          pattern: installed-e2e-*
          path: ${{ runner.temp }}/installed-evidence

      - name: Show collected distributions
        run: ls -1 "$RUNNER_TEMP/pycyber-dist"

      - name: Verify artifacts against release tag
        run: python3 scripts/release/check_release_version.py --publish --wheelhouse "$RUNNER_TEMP/pycyber-dist"

      - name: Require complete qualification and installation evidence for exact published bytes
        run: |
          python3 scripts/testing/qualify_release.py --verify --publish \
            --report "$RUNNER_TEMP/native-evidence/qualification.json" \
            --candidate "$RUNNER_TEMP/native-evidence/candidate" \
            --distributions "$RUNNER_TEMP/pycyber-dist" \
            --installation-reports "$RUNNER_TEMP/installed-evidence"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/pycyber-dist

  publish-native:
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/wheelos_core-v')
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: native-release-candidate
          path: ${{ runner.temp }}/native-evidence
      - name: Recheck exact native candidate
        run: |
          python3 scripts/testing/qualify_release.py --verify --publish \
            --report "$RUNNER_TEMP/native-evidence/qualification.json" \
            --candidate "$RUNNER_TEMP/native-evidence/candidate"
      - name: Publish qualified native bundle and qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft \
            "$RUNNER_TEMP"/native-evidence/candidate/core/*.deb \
            "$RUNNER_TEMP"/native-evidence/candidate/pycyber/*.whl \
            "$RUNNER_TEMP"/native-evidence/candidate/pycyber/*.tar.gz \
            "$RUNNER_TEMP/native-evidence/candidate/manifest.txt" \
            "$RUNNER_TEMP/native-evidence/candidate/SHA256SUMS" \
            "$RUNNER_TEMP/native-evidence/qualification.json"
          gh release edit "$GITHUB_REF_NAME" --draft=false
