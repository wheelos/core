syntax = "proto2";

package apollo.cyber.proto;

import "cyber/proto/rpc.proto";

enum ActionGoalState {
  ACTION_GOAL_UNKNOWN = 0;
  ACTION_GOAL_ACCEPTED = 1;
  ACTION_GOAL_EXECUTING = 2;
  ACTION_GOAL_CANCELING = 3;
  ACTION_GOAL_SUCCEEDED = 4;
  ACTION_GOAL_CANCELLED = 5;
  ACTION_GOAL_ABORTED = 6;
}

message ActionGoalRequest {
  optional string goal_id = 1;
  optional uint64 timeout_ns = 2;
  optional bytes payload = 3;
}

message ActionGoalResponse {
  optional bool accepted = 1;
  optional RpcWireStatus status = 2 [default = RPC_INTERNAL];
  optional string error_message = 3;
}

message ActionCancelRequest {
  optional string goal_id = 1;
}

message ActionCancelResponse {
  optional bool accepted = 1;
  optional RpcWireStatus status = 2 [default = RPC_INTERNAL];
  optional string error_message = 3;
}

message ActionFeedback {
  optional string goal_id = 1;
  optional uint64 sequence = 2;
  optional bytes payload = 3;
}

message ActionResult {
  optional string goal_id = 1;
  optional ActionGoalState state = 2 [default = ACTION_GOAL_UNKNOWN];
  optional RpcWireStatus status = 3 [default = RPC_INTERNAL];
  optional string error_message = 4;
  optional bytes payload = 5;
}
