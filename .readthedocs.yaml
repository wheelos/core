version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    post_checkout:
      - cd docs/doxy-docs && doxygen Doxyfile
  apt_packages:
    - doxygen

sphinx:
  configuration: docs/doxy-docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/doxy-docs/requirements.txt
